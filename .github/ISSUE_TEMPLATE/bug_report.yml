name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A security vulnerability is reported privately, see SECURITY.md, never here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.0.3
    validations:
      required: true
  - type: input
    id: october-version
    attributes:
      label: October CMS version
      placeholder: 4.4.8
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: '8.4'
    validations:
      required: true
