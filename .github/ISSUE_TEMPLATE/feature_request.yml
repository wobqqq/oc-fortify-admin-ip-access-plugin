name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to protect or check, and why the plugin does not do it yet.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
