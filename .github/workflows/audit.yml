name: Security audit

# composer audit also runs in CI on every change; this catches an advisory published
# while the repository is quiet.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Audit the locked dependencies
        run: composer audit --locked --abandoned=report
